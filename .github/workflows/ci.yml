name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm system:test
      - run: node scripts/system-test.mjs --google
      - run: pnpm package
      - uses: actions/upload-artifact@v4
        with:
          name: storycursor
          path: |
            dist/release/storycursor-*.zip
            dist/release/sheets-script/
            docs/store/
